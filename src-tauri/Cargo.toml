[package]
name = "port-guard-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Port Guard Tauri 2 desktop shell"
default-run = "port-guard-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
pf-probe = { path = ".." }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
