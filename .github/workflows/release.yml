name: Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - .github/workflows/release.yml
      - tools/release.py
      - tests/test_release.py
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release.py
      - tests/test_release.py
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to publish; leave empty to build only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release tooling
        run: python -m unittest discover -s tests -p test_release.py -v

      - name: Resolve version and source commit
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          python tools/release.py metadata "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Set application and installer version
        run: python tools/release.py prepare "$RELEASE_VERSION"

      - name: Test Rust workspace
        run: cargo test --workspace --locked --target "$BUILD_TARGET"

      - name: Build desktop installer
        run: npx --no-install tauri build --ci --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" -- --locked

      - name: Collect installer
        run: python tools/release.py collect "$RELEASE_VERSION" "$BUILD_TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: port-guard-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: port-guard-*
          path: release-assets
          merge-multiple: true

      - name: Verify installers and generate checksums
        run: python3 tools/release.py checksums "$RELEASE_VERSION"

      # Upload every asset to a draft before making the release public. A failed
      # upload can be retried; an already published release is never overwritten.
      - name: Create or resume draft and publish
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state.txt; then
            if [ "$(cat draft-state.txt)" != true ]; then
              echo "Release $RELEASE_TAG is already published; use a new version tag."
              exit 1
            fi
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "Port Guard $RELEASE_VERSION" --generate-notes \
              --notes-file docs/release-notes.md "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then flags=(--latest=false); fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" "${flags[@]}"
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
